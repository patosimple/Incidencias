{% extends 'core/base.html' %}
{% block title %}Cambiar contraseña{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-6 sm:mt-10">
    <div class="bg-white dark:bg-slate-800 rounded-lg border border-gray-200 dark:border-slate-700 shadow-sm p-6">
        <h1 class="text-lg font-semibold text-gray-800 dark:text-gray-100 mb-4">Cambiar contraseña</h1>
        <form method="post" class="space-y-4">
            {% csrf_token %}
            {% for field in form %}
            <div>
                <label for="{{ field.id_for_label }}"
                       class="block text-sm font-medium text-gray-700 dark:text-gray-200 mb-1">
                    {{ field.label }}
                </label>
                {{ field }}
                {% if field.errors %}
                <p class="mt-1 text-xs text-red-600 dark:text-red-400">{{ field.errors|striptags }}</p>
                {% endif %}
            </div>
            {% endfor %}
            <button type="submit"
                    class="w-full bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium px-4 py-2 rounded transition-colors">
                Cambiar contraseña
            </button>
        </form>
    </div>
</div>
{% endblock %}
