{# Badge de estado reutilizable. Uso: {% include "core/partials/estado_badge.html" with estado=ticket.estado %} #}
{% if estado == 'PENDIENTE' %}
    <span class="inline-block bg-yellow-100 dark:bg-yellow-900/30 text-yellow-800 dark:text-yellow-300 text-xs font-medium px-2 py-0.5 rounded">Pendiente</span>
{% elif estado == 'EN_PROCESO' %}
    <span class="inline-block bg-blue-100 dark:bg-blue-900/30 text-blue-800 dark:text-blue-300 text-xs font-medium px-2 py-0.5 rounded">En proceso</span>
{% elif estado == 'CERRADO' %}
    <span class="inline-block bg-gray-100 dark:bg-slate-700 text-gray-500 dark:text-gray-400 text-xs font-medium px-2 py-0.5 rounded">Cerrado</span>
{% elif estado == 'REABIERTO' %}
    <span class="inline-block bg-red-100 dark:bg-red-900/30 text-red-700 dark:text-red-300 text-xs font-medium px-2 py-0.5 rounded">Reabierto</span>
{% endif %}
